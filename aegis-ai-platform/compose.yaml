services:
  gateway:
    build: .
    ports: ["127.0.0.1:8080:8080"]
    environment:
      AEGIS_API_KEY: ${AEGIS_API_KEY:?Generate a key and configure .env}
      BACKEND: ${BACKEND:-mock}
      OLLAMA_URL: http://ollama:11434
    volumes: ["aegis-data:/data"]
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
  ollama:
    image: ollama/ollama:0.6.8
    profiles: [llm]
    volumes: ["ollama-data:/root/.ollama"]
volumes:
  aegis-data:
  ollama-data:
