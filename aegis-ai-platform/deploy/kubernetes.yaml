apiVersion: v1
kind: Namespace
metadata:
  name: aegis
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: aegis-data
  namespace: aegis
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: aegis
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: aegis-gateway}
  template:
    metadata:
      labels: {app: aegis-gateway}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: gateway
          image: aegis-gateway:0.1.0
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8080}]
          env:
            - name: AEGIS_API_KEY
              valueFrom:
                secretKeyRef: {name: gateway-secret, key: api-key}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: '1', memory: 512Mi}
          readinessProbe:
            httpGet: {path: /health/ready, port: 8080}
          livenessProbe:
            httpGet: {path: /health/live, port: 8080}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: aegis-data}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: aegis
spec:
  selector: {app: aegis-gateway}
  ports: [{port: 8080, targetPort: 8080}]
